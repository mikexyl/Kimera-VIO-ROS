]

[tasks.kmr-euroc]
cmd = "roslaunch kimera_vio_ros kimera_vio_ros_euroc_xfeat.launch online:=true verbosity:={{ v }} debug:={{ debug }} seq:={{ seq }}"
args = [
  { "arg" = "seq", "default" = "M4" },
  { "arg" = "v", "default" = "0" },
  { "arg" = "debug", "default" = "false" },
]

[tasks.kmr-jackal]
cmd = "roslaunch kimera_vio_ros kimera_vio_d455_xfeat.launch online:=true verbosity:={{ v }} robot_name:={{ robot }} camera_name:=forward debug:={{ debug }}"
args = [
  { "arg" = "v", "default" = "0" },
  { "arg" = "debug", "default" = "0" },
  { "arg" = "robot", "default" = "acl_jackal" },
]

[tasks.kmr-alpha]
cmd = "roslaunch kimera_vio_ros kimera_vio_s3e_alpha_xfeat.launch online:=true verbosity:={{ v }} debug:={{ debug }}"
args = [{ "arg" = "v", "default" = "0" }, { "arg" = "debug", "default" = "0" }]

[tasks.kmr-graco]
cmd = "roslaunch kimera_vio_ros kimera_vio_graco_xfeat.launch online:=true verbosity:={{ v }} debug:={{ debug }} seq:={{ seq }}"
args = [
  { "arg" = "seq", "default" = "a5" },
