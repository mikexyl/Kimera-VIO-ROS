  { "arg" = "seq", "default" = "caf1" },
  { "arg" = "v", "default" = "0" },
  { "arg" = "debug", "default" = "0" },
]

[tasks.xfeat-example]
depends-on = [{ "task" = "build", "args" = ["xfeat-cpp"] }]
cmd = "cd devel/bin && ./xfeat_example $PIXI_PROJECT_ROOT/src/xfeat-cpp/image $PIXI_PROJECT_ROOT/src/xfeat-cpp/onnx_model 0.5 2"

[tasks.xfeat-nms]
depends-on = [{ "task" = "build", "args" = ["xfeat-cpp"] }]
cmd = "cd devel/bin && ./feature_nms_example $PIXI_PROJECT_ROOT/src/xfeat-cpp/image/sample1.jpg $PIXI_PROJECT_ROOT/src/xfeat-cpp/onnx_model 0.5 2"

[tasks.xfeat-faiss-example]
depends-on = [{ "task" = "build", "args" = ["xfeat-cpp"] }]
cmd = "cd devel/bin && ./batch_match_example /datasets/euroc/MH_01_easy/mav0/cam0/data $PIXI_PROJECT_ROOT/src/xfeat-cpp/onnx_model"

[tasks.build]
depends-on = ["config"]
args = [{ "arg" = "package", "default" = "" }]
cmd = "catkin build {{ package }} "

[tasks.build-rerun]
cmd = "cd src/rerun_cpp_sdk && mkdir -p build && cd build && cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON -G Ninja .. && ninja && sudo ninja install"

[tasks.build-all]
depends-on = ["build-gtsam", "build-rerun", "config", "build-kmr"]
cmd = ["echo 'Built Kimera VIO ROS workspace.'"]

[tasks.export-lg]
args = [
  { "arg" = "width", "default" = "640" },
  { "arg" = "height", "default" = "480" },
  { "arg" = "top_k", "default" = "2000" },
]
cmd = [
  "cd",
  "src/accelerated_features",
  "&&",
  "python",
  "export.py",
  "--xfeat_only_lighterglue",
  "--width={{ width }}",
  "--height={{ height }}",
  "--top_k={{ top_k }}",
  "--opset=18",
  "--export_path=lg_{{ width }}x{{ height }}_{{ top_k }}.onnx",
]

[tasks.export-lg-dynamic]
args = [
  { "arg" = "width", "default" = "640" },
  { "arg" = "height", "default" = "480" },
]
cmd = [
  "cd",
  "src/accelerated_features",
  "&&",
  "python",
  "export.py",
  "--xfeat_only_lighterglue",
  "--width={{ width }}",
  "--height={{ height }}",
  "--opset=18",
  "--export_path=lg_{{ width }}x{{ height }}_dyn.onnx",
  "--dynamic",
]


[tasks.extract-netvlad-desc]
depends-on = [{ "task" = "build", "args" = ["xfeat-cpp"] }]
args = [
  { "arg" = "image_folder", "default" = "/datasets_extra/gsv_cities/Images" },
  { "arg" = "output_desc_file", "default" = "$PIXI_PROJECT_ROOT/src/xfeat-cpp/faiss.index.desc.bin" },
  { "arg" = "model_folder", "default" = "$PIXI_PROJECT_ROOT/src/xfeat-cpp/onnx_model" },
]
cmd = [
  "cd",
  "build/xfeat-cpp/scripts",
  "&&",
  "extract_netvlad_desc",
  "{{ image_folder }}",
  "{{ output_desc_file }}",
  "{{ model_folder }}",
]

[tasks.train-faiss-ivf]
depends-on = [{ "task" = "build", "args" = ["xfeat-cpp"] }]
args = [
  { "arg" = "mode", default = "ivfflat" },
  { "arg" = "data_file", "default" = "$PIXI_PROJECT_ROOT/src/xfeat-cpp/faiss.index.desc.bin" },
  { "arg" = "output_index_file", "default" = "$PIXI_PROJECT_ROOT/src/xfeat-cpp/onnx_model/faiss" },
]
cmd = [
  "cd",
  "build/xfeat-cpp/scripts",
  "&&",
  "train_faiss_ivfflat",
  "{{ data_file }}",
  "{{ output_index_file }}",
  "{{ mode }}",
  "0",
]


[dependencies]
python = "3.11.*"
evo = ">=1.31.1,<2"
pip = ">=25.2,<26"
empy = ">=3.3.4,<4"
catkin_pkg = ">=1.0.0,<2"
# git = "*"
# cmake = "<4"

[pypi-dependencies]
tqdm = "*"
imageio = "*"
onnxsim = "*"
torch = { version = "*", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu124" }

[system-requirements]
cuda = "12"
