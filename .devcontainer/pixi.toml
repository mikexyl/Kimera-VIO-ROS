[tasks.evo-euroc-m2]
depends-on = [
  { "task" = "evo-ape", "args" = [
    "EurocMonoXfeat/m2",
    "/datasets/euroc/MH_02_easy/state_groundtruth_estimate0/gt.txt",
  ] },
  { "task" = "evo-rpe", "args" = [
    "EurocMonoXfeat/m2",
    "/datasets/euroc/MH_02_easy/state_groundtruth_estimate0/gt.txt",
  ] },
]

[tasks.evo-euroc-m4]
depends-on = [
  { "task" = "evo", "args" = [
    "ape",
    "EurocMonoXfeat/m4",
    "/datasets/euroc/MH_04_difficult/state_groundtruth_estimate0/gt.txt",
  ] },
  { "task" = "evo", "args" = [
    "rpe",
