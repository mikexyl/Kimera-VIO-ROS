[tasks.kmr-fpv-out-fwd]
cmd = "roslaunch kimera_vio_ros kimera_vio_fpv_out_fwd_xfeat.launch online:=true verbosity:={{ v }} debug:={{ debug }}"
args = [{ "arg" = "v", "default" = "0" }, { "arg" = "debug", "default" = "0" }]

[tasks.kmr-fpv-split]
cmd = "roslaunch kimera_vio_ros kimera_vio_fpv_split_xfeat.launch online:=true verbosity:={{ v }} debug:={{ debug }}"
args = [{ "arg" = "v", "default" = "0" }, { "arg" = "debug", "default" = "0" }]

[tasks.kmr-tumvi]
cmd = "roslaunch kimera_vio_ros kimera_vio_tum_xfeat.launch online:=true verbosity:={{ v }} debug:={{ debug }}"
args = [{ "arg" = "v", "default" = "0" }, { "arg" = "debug", "default" = "0" }]

