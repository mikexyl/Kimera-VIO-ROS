    "/datasets_extra/graco/aerial-08-25m.txt",
  ] },
  { "task" = "evo", "args" = [
    "rpe",
    "GrAcoMonoXfeat/a8",
    "/datasets_extra/graco/aerial-08-25m.txt",
  ] },
]

[tasks.evo-euroc-m2]
depends-on = [
  { "task" = "evo-ape", "args" = [
    "EurocMonoXfeat/m2",
    "/datasets/euroc/MH_02_easy/state_groundtruth_estimate0/gt.txt",
  ] },
  { "task" = "evo-rpe", "args" = [
