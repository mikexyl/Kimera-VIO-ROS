[workspace]
authors = ["Mike Xiangyu Liu <liu.xiangyu@ucy.ac.cy>"]
channels = ["rapidsai-nightly", "conda-forge", "nvidia", "rapidsai"]
name = "kimera_noetic_ws"
platforms = ["linux-64"]
version = "0.1.0"

[activation]
scripts = ["/opt/ros/noetic/setup.sh", "devel/setup.sh"]

[activation.env]
LD_LIBRARY_PATH = "$LD_LIBRARY_PATH:/usr/lib/x86_64-linux-gnu:/usr/local/lib:${PIXI_PROJECT_ROOT}/.pixi/envs/${PIXI_ENVIRONMENT_NAME}/lib:/workspaces/src/onnxruntime-linux-x64-gpu-1.22.0/lib"
FAISS_CMAKE_ARGS = "-DFAISS_ENABLE_GPU=ON -DFAISS_ENABLE_PYTHON=ON -DFAISS_ENABLE_CUVS=ON -Dcuvs_DIR=/workspaces/.pixi/envs/default/lib/cmake/cuvs -DBUILD_TESTING=OFF"
LIBGL_ALWAYS_SOFTWARE = "1"
KIMERA_OUTPUT_PATH = "/workspaces/src/Kimera-VIO-ROS/output_logs"

[tasks.build-faiss]
cwd = "src/faiss"
cmd = [
  "cmake",
  "-B",
  "build",
  "-DFAISS_ENABLE_GPU=ON",
  "-DFAISS_ENABLE_PYTHON=OFF",
  "-DBUILD_SHARED_LIBS=ON",
  "-DCMAKE_BUILD_TYPE=Release",
  "-DCMAKE_INSTALL_PREFIX=/usr/local",
  "-DBUILD_TESTING=OFF",
  "-G",
  "Ninja",
  "&&",
  "cmake",
  "--build",
  "build",
  "&&",
  "sudo",
  "cmake",
  "--install",
  "build",
]

[tasks]
clone-src = { cmd = "mkdir -p src && git clone git@github.com:MIT-SPARK/Kimera-VIO-ROS.git src/Kimera-VIO-ROS && vcs import src < src/Kimera-VIO-ROS/install/kimera_vio_ros_ssh.rosinstall" }
config = { cmd = [
  "catkin",
  "config",
  "--merge-devel",
  "-DCMAKE_BUILD_TYPE=Release",
  "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
  "-DCMAKE_CXX_FLAGS=-Wno-error=unused-but-set-variable -Wno-error=deprecated-copy",
  "-DCMAKE_C_COMPILER_LAUNCHER=ccache",
  "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
  "-DCMAKE_C_COMPILER=gcc",
  "-DCMAKE_CXX_COMPILER=g++",
  "-DKIMERA_BUILD_TESTS=OFF",
  "-Donnxruntime_DIR=/workspaces/src/onnxruntime-linux-x64-gpu-1.22.0",
  "-DCUBLAS_DIR=/usr/local/cuda",
  "-Dfaiss_DIR=/workspaces/src/faiss/build",
] }
build-gtsam = { cmd = "cd src/gtsam && mkdir -p build && cd build && cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=1 -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_BUILD_TYPE=Release -DGTSAM_USE_SYSTEM_METIS=ON -DGTSAM_BUILD_UNSTABLE=ON -DGTSAM_USE_SYSTEM_EIGEN=ON -DGTSAM_POSE3_EXPMAP=ON -DGTSAM_ROT3_EXPMAP=ON -DGTSAM_TANGENT_PREINTEGRATION=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -G Ninja -DGTSAM_BUILD_TESTS=OFF -DGTSAM_BUILD_EXAMPLES_ALWAYS=OFF .. && ninja && sudo ninja install" }
clean-ws = { cmd = "catkin clean -y" }
rviz = { cmd = "rviz" }
roscore = { cmd = "roscore" }
rqt = { cmd = "rqt --force-discover" }
kmr-rviz = { cmd = "rviz -d $(rospack find kimera_vio_ros)/rviz/kimera_vio_euroc.rviz" }
download-rerun = { cmd = "cd src && wget https://github.com/rerun-io/rerun/releases/download/0.24.0/rerun_cpp_sdk.zip && unzip rerun_cpp_sdk.zip && rm rerun_cpp_sdk.zip" }
build-kmr = { cmd = "catkin build kimera_vio kimera_vio_ros" }
play-euroc-m2 = { cmd = "cd /datasets/euroc && rosbag play --clock -s 30 MH_02_easy.bag" }
play-euroc-m4 = { cmd = "cd /datasets/euroc && rosbag play --clock -s 15 MH_04_difficult.bag" }
play-jackal = { cmd = "cd /datasets && rosbag play --clock -s 20 10_14_acl_jackal.bag" }
play-square1-alpha = { cmd = "cd /datasets_extra/S3E/Square1 && rosbag play --clock -s 0 square1.bag" }
play-square2-alpha = { cmd = "cd /datasets_extra/S3E/Square2 && rosbag play --clock -s 0 square2.bag" }
play-graco8 = { cmd = "cd /datasets_extra/graco && rosbag play --clock -s 0 aerial-08-25m.bag" }
play-graco7 = { cmd = "cd /datasets_extra/graco && rosbag play --clock -s 0 aerial-07-25m.bag" }
play-graco-a5 = { cmd = "cd /datasets_extra/graco && rosbag play --clock -s 0 aerial-05-40m.bag" }
play-graco-g1 = { cmd = "cd /datasets_extra/graco && rosbag play --clock -s 0 ground-01.bag" }
play-graco-g2 = { cmd = "cd /datasets_extra/graco && rosbag play --clock -s 0 ground-02.bag" }
play-hilti-01 = { cmd = "cd /datasets_extra/hilti && rosbag play --clock -s 0 exp01_construction_ground_level.bag" }
play-hilti-04 = { cmd = "cd /datasets_extra/hilti && rosbag play --clock -s 0 exp04_construction_upper_level.bag" }
play-hilti-06 = { cmd = "cd /datasets_extra/hilti && rosbag play --clock -s 0 exp06_construction_upper_level_3.bag" }
play-hilti-09 = { cmd = "cd /datasets_extra/hilti && rosbag play --clock -s 0 exp09_cupola.bag" }
play-hilti-16 = { cmd = "cd /datasets_extra/hilti && rosbag play --clock -s 0 exp16_attic_to_upper_gallery_2.bag" }
play-hilti-18 = { cmd = "cd /datasets_extra/hilti && rosbag play --clock -s 0 exp18_corridor_lower_gallery_2.bag" }
play-fpv-out-fwd1 = { cmd = "cd /datasets_extra/fpv_racing && rosbag play --clock -s 25 outdoor_forward_1_snapdragon_with_gt.bag" }
play-fpv-out-fwd3 = { cmd = "cd /datasets_extra/fpv_racing && rosbag play --clock -s 25 outdoor_forward_3_snapdragon_with_gt.bag" }
play-fpv-out-fwd5 = { cmd = "cd /datasets_extra/fpv_racing && rosbag play --clock -s 45 outdoor_forward_5_snapdragon_with_gt.bag" }
play-fpv-split = { cmd = "cd /datasets_extra/fpv_racing && rosbag play --clock -s 0 race_1.bag" }
play-tumvi-c4 = { cmd = "cd /datasets_extra/tum_vi/ros && rosbag play --clock -s 0 dataset-corridor4_512_16.bag" }
play-tumvi-m2 = { cmd = "cd /datasets_extra/tum_vi/ros && rosbag play --clock -s 30 dataset-magistrale2_512_16.bag" }
play-loris-cafe1 = { cmd = "cd /datasets_extra/loris/cafe1-1_2-rosbag/uncompressed && rosbag play --clock -s 0 vins1.bag" }
play-nc-05 = { cmd = "cd /datasets_extra/new_college/05_quad_with_dynamics && rosbag play --clock -s 0 05.bag" }
play-nc-01 = { cmd = "cd /datasets_extra/new_college/01_short_experiment && rosbag play --clock -s 0 05.bag" }
play-spires-church = { cmd = "cd /datasets_extra/spires/christchurch && rosbag play --clock -s 0 church.bag /tf:= /tf_static:=" }
download-onnx = { cmd = "wget https://codeload.github.com/microsoft/onnxruntime/zip/refs/tags/v1.22.0" }
jupyter = { cmd = "jupyter lab" }

[tasks.evo-ape]
cmd = "evo_ape tum /workspaces/src/Kimera-VIO-ROS/output_logs/{{ config }}/results/leSLAM.txt {{ gt }} -vap --plot_mode=xy --t_max_diff=0.2"
args = [
  { "arg" = "config", "default" = "GrAcoMonoXfeat" },
  { "arg" = "gt", "default" = "/datasets_extra/graco/aerial-07-25m.txt" },
]

[tasks.evo-rpe]
cmd = "evo_rpe tum /workspaces/src/Kimera-VIO-ROS/output_logs/{{ config }}/results/leSLAM.txt {{ gt }} -vap --plot_mode=xy --delta=5 --delta_unit=m --t_max_diff=0.2"
args = [
  { "arg" = "config", "default" = "GrAcoMonoXfeat" },
  { "arg" = "gt", "default" = "/datasets_extra/graco/aerial-07-25m.txt" },
]

[tasks.evo-traj]
cmd = "evo_traj tum $KIMERA_OUTPUT_PATH/{{ config }}/results/leSLAM.txt --ref={{ gt }} -vap --plot_mode=xy --save_plot $KIMERA_OUTPUT_PATH/{{ config }}/results/evo.png --t_max_diff=0.2"
args = [
  { "arg" = "config", "default" = "GrAcoMonoXfeat/a7" },
  { "arg" = "gt", "default" = "/datasets_extra/graco/aerial-07-25m.txt" },
]


[tasks.evo-hilti-04]
cmd = "pixi run evo-traj {{ config }} {{ gt }} && pixi run evo ape {{ config }} {{ gt }} && pixi run evo rpe {{ config }} {{ gt }}"
args = [
  { "arg" = "config", "default" = "HiltiMonoXfeat/04" },
  { "arg" = "gt", "default" = "/datasets_extra/hilti/exp_04_construction_upper_level_imu.txt" },
]

[tasks.evo-hilti-06]
cmd = "pixi run evo-traj {{ config }} {{ gt }} && pixi run evo-ape {{ config }} {{ gt }} && pixi run evo-rpe {{ config }} {{ gt }}"
args = [
  { "arg" = "config", "default" = "HiltiMonoXfeat/06" },
  { "arg" = "gt", "default" = "/datasets_extra/hilti/exp_06_construction_upper_level_3_imu.txt" },
]

[tasks.evo-hilti-16]
cmd = "pixi run evo-traj {{ config }} {{ gt }} && pixi run evo-ape {{ config }} {{ gt }} && pixi run evo-rpe {{ config }} {{ gt }}"
args = [
  { "arg" = "config", "default" = "HiltiMonoXfeat/16" },
  { "arg" = "gt", "default" = "/datasets_extra/hilti/exp16_attic_to_upper_gallery_2_imu.txt" },
]

[tasks.evo-graco-g1]
cmd = "pixi run evo-traj {{ config }} {{ gt }} && pixi run evo-ape {{ config }} {{ gt }} && pixi run evo-rpe {{ config }} {{ gt }}"
args = [
  { "arg" = "config", "default" = "GrAcoGndMonoXfeat/g1" },
