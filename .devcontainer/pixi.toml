play-graco-g2 = { cmd = "cd /datasets_extra/graco && rosbag play --clock -s 0 ground-02.bag" }
play-graco-g3 = { cmd = "cd /datasets_extra/graco && rosbag play --clock -s 0 ground-03.bag" }
play-hilti-01 = { cmd = "cd /datasets_extra/hilti && rosbag play --clock -s 0 exp01_construction_ground_level.bag" }
play-hilti-04 = { cmd = "cd /datasets_extra/hilti && rosbag play --clock -s 0 exp04_construction_upper_level.bag" }
play-hilti-05 = { cmd = "cd /datasets_extra/hilti && rosbag play --clock -s 0 exp05_construction_upper_level_2.bag" }
play-hilti-06 = { cmd = "cd /datasets_extra/hilti && rosbag play --clock -s 0 exp06_construction_upper_level_3.bag" }
play-hilti-09 = { cmd = "cd /datasets_extra/hilti && rosbag play --clock -s 0 exp09_cupola.bag" }
