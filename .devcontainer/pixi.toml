play-fpv-out-fwd1 = { cmd = "cd /datasets_extra/fpv_racing && rosbag play --clock -s 25 outdoor_forward_1_snapdragon_with_gt.bag" }
play-fpv-out-fwd3 = { cmd = "cd /datasets_extra/fpv_racing && rosbag play --clock -s 25 outdoor_forward_3_snapdragon_with_gt.bag" }
play-fpv-out-fwd5 = { cmd = "cd /datasets_extra/fpv_racing && rosbag play --clock -s 45 outdoor_forward_5_snapdragon_with_gt.bag" }
play-fpv-split = { cmd = "cd /datasets_extra/fpv_racing && rosbag play --clock -s 0 race_1.bag" }
play-tumvi-c4 = { cmd = "cd /datasets_extra/tum_vi/ros && rosbag play --clock -s 0 dataset-corridor4_512_16.bag" }
play-tumvi-m2 = { cmd = "cd /datasets_extra/tum_vi/ros && rosbag play --clock -s 30 dataset-magistrale2_512_16.bag" }
play-loris-cafe1 = { cmd = "cd /datasets_extra/loris/cafe1-1_2-rosbag/uncompressed && rosbag play --clock -s 0 vins1.bag" }
play-nc-05 = { cmd = "cd /datasets_extra/new_college/05_quad_with_dynamics && rosbag play --clock -s 0 05.bag" }
play-nc-01 = { cmd = "cd /datasets_extra/new_college/01_short_experiment && rosbag play --clock -s 0 05.bag" }
play-spires-church = { cmd = "cd /datasets_extra/spires/christchurch && rosbag play --clock -s 0 church.bag /tf:= /tf_static:=" }
download-onnx = { cmd = "wget https://codeload.github.com/microsoft/onnxruntime/zip/refs/tags/v1.22.0" }
jupyter = { cmd = "jupyter lab" }
setup-cuda = "sudo nvidia-cuda-mps-control -d && ps aux | grep nvidia-cuda-mps"

[tasks.evo-ape]
cmd = "evo_ape tum {{ gt }} $KIMERA_OUTPUT_PATH/{{ config }}/results/{{ method }}.txt -vap --plot_mode=xy --t_max_diff=0.2 --save_results $KIMERA_OUTPUT_PATH/{{ config }}/results/{{ method }}.zip"
args = [
  { "arg" = "config", "default" = "GrAcoMonoXfeat" },
  { "arg" = "gt", "default" = "/datasets_extra/graco/aerial-07-25m.txt" },
  { "arg" = "method", "default" = "leSLAM" },
]

[tasks.evo-rpe]
cmd = "evo_rpe tum {{ gt }}  $KIMERA_OUTPUT_PATH/{{ config }}/results/{{ method }}.txt -vap --plot_mode=xy --delta=5 --delta_unit=m --t_max_diff=0.2"
args = [
  { "arg" = "config", "default" = "GrAcoMonoXfeat" },
  { "arg" = "gt", "default" = "/datasets_extra/graco/aerial-07-25m.txt" },
  { "arg" = "method", "default" = "leSLAM" },
]

[tasks.evo-traj]
cmd = "evo_traj tum $KIMERA_OUTPUT_PATH/{{ config }}/results/leVIO.txt $KIMERA_OUTPUT_PATH/{{ config }}/results/leSLAM.txt --ref={{ gt }} -vap --plot_mode=xy --save_plot $KIMERA_OUTPUT_PATH/{{ config }}/results/evo.png --t_max_diff=0.2"
args = [
  { "arg" = "config", "default" = "GrAcoMonoXfeat/a7" },
  { "arg" = "gt", "default" = "/datasets_extra/graco/aerial-07-25m.txt" },
]

[tasks.evo-graco-g1-all]
cmd = "pixi run evo-ape {{ config }} {{ gt }} Kimera && pixi run evo-ape {{ config }} {{ gt }} ORB-SLAM3 && pixi run evo-ape {{ config }} {{ gt }} leVIO && pixi run evo-ape {{ config }} {{ gt }} VINS-Fusion && pixi run evo-ape {{ config }} {{ gt }} leSLAM && pixi run evo-ape {{ config }} {{ gt }} leVIO"
args = [
  { "arg" = "config", "default" = "GrAcoGndMonoXfeat/g1" },
  { "arg" = "gt", "default" = "/datasets_extra/graco/g1/gt.txt" },
]

[tasks.plot-graco-g2-all]
cwd = "/workspaces/src/Kimera-VIO-ROS/output_logs/GrAcoGndMonoXfeat/g2/results"
cmd = "evo_traj tum leVIO.txt leSLAM.txt ORB-SLAM3.txt VINS-Fusion.txt Kimera.txt leVIO.txt leSLAM.txt --ref={{ gt }} -vap --plot_mode=xy --save_plot evo_all.eps --t_max_diff=0.2"
args = [
  { "arg" = "config", "default" = "GrAcoGndMonoXfeat/g2" },
  { "arg" = "gt", "default" = "/datasets_extra/graco/g2/gt.txt" },
]

